# PathWay — Next.js (5500) + Traefik + Let's Encrypt
#
# Dominio: visalawyer.online  (equivalente a luxuryrent.site del ejemplo del profe)
# Email LE: josemopalo@gmail.com  (equivalente a info@luxuryrent.site)
#
# 1) cp .env.compose.example .env
# 2) Edita .env si hace falta
# 3) docker compose up --build -d
#
# URL: https://visalawyer.online/pathway

services:
  traefik:
    image: traefik:v3.6.1
    container_name: pathway-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --api.dashboard=true
      # Dashboard solo interno; NO exponer 8080 sin auth en producción
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=pathway-net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Let's Encrypt (TLS challenge — no redirigir HTTP globalmente)
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-josemopalo@gmail.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --global.sendanonymoususage=false
      - --log.level=${LOG_LEVEL:-INFO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - pathway-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: frontend
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathway-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "5500"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      API_PROXY_TARGET: http://api:3000
    expose:
      - "5500"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pathway-net"
      # HTTP → HTTPS
      - "traefik.http.routers.pathway-web-http.rule=Host(`${DOMAIN:-visalawyer.online}`)"
      - "traefik.http.routers.pathway-web-http.entrypoints=web"
      - "traefik.http.routers.pathway-web-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      # HTTPS + certificado Let's Encrypt
      - "traefik.http.routers.pathway-web-https.rule=Host(`${DOMAIN:-visalawyer.online}`)"
      - "traefik.http.routers.pathway-web-https.entrypoints=websecure"
      - "traefik.http.routers.pathway-web-https.tls=true"
      - "traefik.http.routers.pathway-web-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pathway-web-https.service=pathway-web"
      - "traefik.http.routers.pathway-web-https.middlewares=security-headers"
      - "traefik.http.services.pathway-web.loadbalancer.server.port=5500"
      # Headers de seguridad (como el ejemplo del profe)
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.sslRedirect=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
    networks:
      - pathway-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5500/pathway"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    image: backend
    container_name: pathway-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "3000"
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_TRIAL_DAYS: ${STRIPE_TRIAL_DAYS:-7}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      PUBLIC_APP_ORIGIN: https://${DOMAIN:-visalawyer.online}
      CORS_ORIGIN: https://${DOMAIN:-visalawyer.online}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - pathway-net

networks:
  pathway-net:
    name: pathway-net
    driver: bridge

volumes:
  traefik-letsencrypt:
